<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Qui a dit ça ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #5b6fd6; --bg2: #4a55b8; --panel: #2f3a86; --panel2: #3b479d; --line: #8fb0ff;
    --text: #f4f6ff; --muted: #b9c3f5; --green: #4ade80; --red: #f87171; --gold: #ffd43b;
    --pixel: "Pixelify Sans", ui-monospace, monospace; --body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--body); color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg1), var(--bg2) 70%) fixed;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  .pixel { font-family: var(--pixel); letter-spacing: .02em; }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  .app.with-side { grid-template-columns: 1fr 230px; }
  @media (max-width: 800px) { .app.with-side { grid-template-columns: 1fr; } .side { order: 2; } }

  .panel { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 2px solid color-mix(in srgb, var(--line) 50%, transparent); border-radius: 14px; padding: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.18); }
  .center { text-align: center; }
  h1.title { font-family: var(--pixel); font-size: clamp(34px, 7vw, 64px); margin: 8px 0 4px; text-shadow: 0 4px 0 rgba(0,0,0,.25); line-height: 1.05; }
  .label { font-family: var(--pixel); font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .12em; }
  .question { font-family: var(--pixel); font-size: clamp(24px, 4.2vw, 42px); text-transform: uppercase; text-align: center; margin: 6px 0 18px; line-height: 1.15; text-shadow: 0 3px 0 rgba(0,0,0,.25); }

  .btn { font-family: var(--pixel); font-size: 18px; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; background: #7bc47f; color: #10301a; box-shadow: 0 5px 0 #3e7d44; transition: transform .05s; text-transform: uppercase; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3e7d44; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.blue { background: #8fb0ff; color: #12204f; box-shadow: 0 5px 0 #4e64b8; }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: none; border: 2px solid var(--line); }
  .btn.small { font-size: 14px; padding: 7px 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row.center { justify-content: center; }

  input.field, textarea.field, select.field { width: 100%; background: #313f90; border: 2px solid var(--line); border-radius: 8px; padding: 12px; outline: none; }
  input.field:focus, textarea.field:focus { border-color: #fff; }
  textarea.field { min-height: 130px; resize: vertical; font-size: 18px; }

  .avatar { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; border: 3px solid rgba(255,255,255,.85); flex: none; position: relative; }
  .avatar.sm { width: 26px; height: 26px; font-size: 14px; border-width: 2px; border-radius: 7px; }
  .avatar.lg { width: 74px; height: 74px; font-size: 42px; border-radius: 16px; }
  .pname { font-family: var(--pixel); text-transform: uppercase; font-size: 14px; }

  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
  .pick-grid button { border: 2px solid transparent; background: #3b479d; border-radius: 10px; font-size: 24px; padding: 6px; cursor: pointer; }
  .pick-grid button.sel { border-color: #fff; background: #5566c5; }
  .colors button { height: 34px; }

  .side .plist { display: grid; gap: 8px; }
  .side .pl { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.05); }
  .side .pl.off { opacity: .45; }
  .side .pl .score { margin-left: auto; font-family: var(--pixel); background: #8fd3ff; color: #12204f; border-radius: 8px; padding: 1px 8px; min-width: 28px; text-align: center; }
  .done-badge { position: absolute; right: -6px; bottom: -6px; background: var(--green); color: #0b3; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; display: grid; place-items: center; color: #053; border: 2px solid #fff; }
  .crown { position: absolute; top: -12px; left: -6px; font-size: 16px; }

  .timer { height: 10px; background: rgba(0,0,0,.25); border-radius: 6px; overflow: hidden; margin: 6px 0 2px; }
  .timer > div { height: 100%; background: linear-gradient(90deg, #8fd3ff, #ffd43b); transition: width .25s linear; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chip { font-family: var(--pixel); font-size: 13px; background: rgba(0,0,0,.2); border-radius: 999px; padding: 4px 12px; }

  .players-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 10px; }
  .players-pick button { background: #3b479d; border: 3px solid transparent; border-radius: 14px; padding: 12px 6px; cursor: pointer; display: grid; justify-items: center; gap: 8px; }
  .players-pick button:hover:not(:disabled) { background: #4a58b5; }
  .players-pick button.sel { border-color: var(--gold); background: #5566c5; }
  .players-pick button:disabled { cursor: default; }

  .anec-card { background: #313f90; border: 2px solid var(--line); border-radius: 12px; padding: 22px; font-size: clamp(18px, 2.6vw, 24px); line-height: 1.4; text-align: center; white-space: pre-wrap; word-break: break-word; }
  .reveal-card { background: #313f90; border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
  .reveal-card .txt { white-space: pre-wrap; word-break: break-word; }
  .vote-line { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 3px 8px; border-radius: 8px; }
  .vote-line.ok { background: rgba(74,222,128,.18); }
  .vote-line.ko { background: rgba(248,113,113,.15); }

  .tally { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-top: 10px; }
  .tally .col { display: grid; justify-items: center; gap: 6px; min-width: 84px; }
  .tally .count { font-family: var(--pixel); background: #8fd3ff; color: #12204f; border-radius: 8px; padding: 2px 12px; }
  .tally .col.top .count { background: var(--gold); }
  .mini-row { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 110px; }

  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 520px; margin: 0 auto; }
  .yn button { font-family: var(--pixel); font-size: 32px; padding: 28px; border-radius: 16px; border: 4px solid transparent; cursor: pointer; text-transform: uppercase; }
  .yn .oui { background: #2f9e5e; } .yn .non { background: #c94a4a; }
  .yn button.sel { border-color: #fff; transform: scale(1.03); }
  .bars { max-width: 560px; margin: 0 auto; background: #2a3580; border: 2px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
  .bar-row { display: grid; grid-template-columns: 44px 60px 1fr; align-items: center; gap: 10px; font-family: var(--pixel); text-transform: uppercase; }
  .bar-row .n { background: #8fd3ff; color: #12204f; border-radius: 8px; text-align: center; padding: 2px 0; }
  .bar { height: 14px; background: rgba(0,0,0,.25); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; transition: width .8s ease; }

  .code-big { font-family: var(--pixel); font-size: clamp(44px, 10vw, 86px); letter-spacing: .15em; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .lobby-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .lobby-players .lp { background: #3b479d; border-radius: 12px; padding: 12px; display: grid; justify-items: center; gap: 6px; position: relative; }
  .lp .kick { position: absolute; top: 4px; right: 6px; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 16px; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .settings label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; font-family: var(--pixel); color: var(--muted); margin: 8px 0; }
  .muted { color: var(--muted); }
  .err { color: #ffd0d0; min-height: 1.3em; text-align: center; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1e2766; border: 2px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 10; }
  .podium { display: grid; gap: 8px; max-width: 520px; margin: 0 auto; }
  .podium .pr { display: flex; align-items: center; gap: 12px; background: #3b479d; border-radius: 12px; padding: 10px 14px; }
  .podium .pr.first { background: linear-gradient(90deg, #b8860b, #3b479d 70%); }
  .podium .rank { font-family: var(--pixel); font-size: 22px; width: 34px; }
  .podium .pts { margin-left: auto; font-family: var(--pixel); font-size: 20px; }
  .fade-in { animation: fade .35s ease; }
  main.panel:not(.fade-in) .fade-in { animation: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
// ================== état client ==================
const AVATARS = ["🦊","🐸","🐼","🐙","🦄","🐲","👽","🤖","👻","🐵","🦁","🐧","🍕","🌵","💀","🤡","🐱","🐶","🦖","🐝"];
const COLORS = ["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#38d9a9","#4dabf7","#748ffc","#da77f2","#f783ac","#adb5bd"];
const TYPE_LABEL = { anecdote: "Anecdote", qui: "Qui est le plus…", ouinon: "Oui ou non" };

const saved = JSON.parse(localStorage.getItem("qadc_profile") || "{}");
let profile = {
  name: saved.name || "",
  avatar: saved.avatar || AVATARS[Math.floor(Math.random() * AVATARS.length)],
  color: saved.color || COLORS[Math.floor(Math.random() * COLORS.length)],
};
let session = JSON.parse(localStorage.getItem("qadc_session") || "null"); // {code, pid}
let S = null;            // dernière vue reçue du serveur
let clockOffset = 0;     // serveur - client
let es = null;
let screenKey = "";
const $app = document.getElementById("app");

// ================== helpers DOM ==================
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const player = (id) => S?.players.find((p) => p.id === id) || { id, name: "???", avatar: "❔", color: "#888", score: 0 };
function avatarEl(p, size = "", extra = {}) {
  const el = h("div", { class: `avatar ${size}`, style: `background:${p.color}`, title: p.name }, p.avatar);
  if (extra.crown) el.append(h("span", { class: "crown" }, "👑"));
  if (extra.done) el.append(h("span", { class: "done-badge" }, "✓"));
  return el;
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Erreur");
  return data;
}
async function act(type, extra = {}) {
  try { await post("/api/action", { code: session.code, pid: session.pid, type, ...extra }); }
  catch (e) { toast(e.message); }
}
const isHost = () => S && S.hostId === S.me;

// ================== connexion ==================
function connect() {
  if (es) es.close();
  es = new EventSource(`/events?code=${encodeURIComponent(session.code)}&pid=${encodeURIComponent(session.pid)}`);
  es.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.kicked) { leave("Tu as été retiré de la salle."); return; }
    clockOffset = data.now - Date.now();
    S = data;
    render();
  };
  es.onerror = async () => {
    // salle disparue (serveur redémarré, etc.) ?
    if (!session) return;
    try {
      const r = await fetch(`/api/check?code=${encodeURIComponent(session.code)}&pid=${encodeURIComponent(session.pid)}`);
      if (r.status === 404) leave("La salle n'existe plus.");
    } catch {}
  };
}
function leave(msg) {
  if (es) es.close();
  es = null; S = null; session = null; screenKey = "";
  localStorage.removeItem("qadc_session");
  history.replaceState(null, "", "/");
  renderHome();
  if (msg) toast(msg);
}

// ================== écran d'accueil ==================
function renderHome() {
  screenKey = "home";
  $app.className = "app";
  const raw = (location.pathname.slice(1) || new URLSearchParams(location.search).get("code") || "").toUpperCase();
  const urlCode = /^[A-Z]{4}$/.test(raw) ? raw : "";
  const err = h("div", { class: "err" });
  const nameIn = h("input", { class: "field", maxlength: 16, placeholder: "Ton pseudo", value: profile.name });
  const codeIn = h("input", { class: "field pixel", maxlength: 4, placeholder: "CODE", value: urlCode, style: "text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:22px" });

  const avGrid = h("div", { class: "pick-grid" });
  const colGrid = h("div", { class: "pick-grid colors" });
  const preview = h("div", {});
  function refreshPickers() {
    avGrid.replaceChildren(...AVATARS.map((a) => h("button", { class: a === profile.avatar ? "sel" : "", onclick: () => { profile.avatar = a; refreshPickers(); } }, a)));
    colGrid.replaceChildren(...COLORS.map((c) => h("button", { class: c === profile.color ? "sel" : "", style: `background:${c}`, onclick: () => { profile.color = c; refreshPickers(); }, "aria-label": c })));
    preview.replaceChildren(avatarEl(profile, "lg"));
  }
  refreshPickers();

  function saveProfile() {
    profile.name = nameIn.value.trim();
    localStorage.setItem("qadc_profile", JSON.stringify(profile));
    if (!profile.name) { err.textContent = "Choisis un pseudo !"; nameIn.focus(); return false; }
    return true;
  }
  async function start(kind) {
    err.textContent = "";
    if (!saveProfile()) return;
    try {
      const data = kind === "create"
        ? await post("/api/create", profile)
        : await post("/api/join", { ...profile, code: codeIn.value.trim().toUpperCase() });
      session = { code: data.code, pid: data.pid };
      localStorage.setItem("qadc_session", JSON.stringify(session));
      history.replaceState(null, "", "/" + data.code);
      connect();
    } catch (e) { err.textContent = e.message; }
  }
  nameIn.addEventListener("keydown", (e) => e.key === "Enter" && (codeIn.value ? start("join") : start("create")));
  codeIn.addEventListener("keydown", (e) => e.key === "Enter" && start("join"));

  $app.replaceChildren(
    h("div", { class: "center fade-in" },
      h("div", { class: "label", style: "margin-top:20px" }, "party game entre potes"),
      h("h1", { class: "title" }, "QUI A DIT ÇA ?"),
      h("p", { class: "muted" }, "Anecdotes, votes et révélations gênantes. 3 à 12 joueurs.")
    ),
    h("div", { class: "panel fade-in", style: "max-width:560px;margin:0 auto;width:100%;display:grid;gap:14px" },
      h("div", { class: "row", style: "flex-wrap:nowrap" }, preview, nameIn),
      h("div", {}, h("div", { class: "label", style: "margin-bottom:6px" }, "Avatar"), avGrid),
      h("div", {}, h("div", { class: "label", style: "margin-bottom:6px" }, "Couleur"), colGrid),
      h("div", { class: "row", style: "flex-wrap:nowrap;margin-top:6px" }, codeIn, h("button", { class: "btn blue", onclick: () => start("join") }, "Rejoindre")),
      h("div", { class: "center muted" }, "— ou —"),
      h("button", { class: "btn", onclick: () => start("create") }, "Créer une salle"),
      err
    )
  );
  if (urlCode) codeIn.style.borderColor = "#fff";
  if (location.protocol === "file:") {
    err.innerHTML = "⚠️ Tu as ouvert le fichier directement. Lance d'abord le serveur avec <b>node server.js</b> puis va sur <b>http://localhost:3000</b>";
  }
}

// ================== barre latérale joueurs ==================
function sidebar() {
  const doneSet = new Set(S.done || []);
  const showDone = ["write", "guess", "vote"].includes(S.phase);
  return h("aside", { class: "side panel" },
    h("div", { class: "label", style: "margin-bottom:10px" }, `Salle ${S.code}`),
    h("div", { class: "plist" },
      [...S.players].sort((a, b) => b.score - a.score).map((p) =>
        h("div", { class: "pl" + (p.connected ? "" : " off") },
          avatarEl(p, "sm", { done: showDone && doneSet.has(p.id) }),
          h("span", { class: "pname", style: "font-size:13px" }, p.name + (p.id === S.me ? " (toi)" : "")),
          h("span", { class: "score" }, p.score)
        )
      )
    )
  );
}

// ================== timer ==================
let timerEls = [];
function timerBar() {
  const fill = h("div", {});
  const label = h("span", { class: "chip" }, "");
  timerEls.push({ fill, label, total: Math.max(1, (S.duration || 1) * 1000) });
  return { bar: h("div", { class: "timer" }, fill), label };
}
setInterval(() => {
  if (!S || !S.deadline) return;
  const left = Math.max(0, S.deadline - (Date.now() + clockOffset));
  for (const t of timerEls) {
    t.fill.style.width = Math.min(100, (left / t.total) * 100) + "%";
    t.label.textContent = "⏱ " + Math.ceil(left / 1000) + "s";
  }
}, 250);

function header() {
  const t = timerBar();
  return h("div", {},
    h("div", { class: "topbar" },
      h("span", { class: "chip" }, `Manche ${S.roundNum}/${S.totalRounds} · ${TYPE_LABEL[S.round.type]}`),
      h("div", { class: "row" },
        S.deadline ? t.label : null,
        isHost() && ["write", "guess", "vote"].includes(S.phase) ? h("button", { class: "btn ghost small", onclick: () => act("skip") }, "Passer ⏭") : null
      )
    ),
    S.deadline ? t.bar : null
  );
}

// ================== rendu principal ==================
function render() {
  if (!S) return;
  const key = [S.phase, S.roundNum, S.anecdote?.index ?? ""].join("|");
  const sameScreen = key === screenKey;
  screenKey = key;

  // Écrans avec saisie : on ne reconstruit pas le contenu principal pour ne pas perdre le texte en cours
  if (sameScreen && (S.phase === "write" || S.phase === "lobby")) {
    updateLiveBits();
    lastDeadline = S.deadline;
    return;
  }
  lastDeadline = S.deadline;
  timerEls = [];
  const main = h("main", { class: sameScreen ? "panel" : "panel fade-in" });
  const screens = { lobby: lobbyScreen, write: writeScreen, guess: guessScreen, anecReveal: anecRevealScreen, vote: voteScreen, voteReveal: voteRevealScreen, end: endScreen };
  (screens[S.phase] || (() => {}))(main);
  if (S.phase === "lobby") { $app.className = "app"; $app.replaceChildren(main); }
  else { $app.className = "app with-side"; $app.replaceChildren(main, sidebar()); }
}

// mises à jour "légères" sans perdre le focus
let live = {};
let lastDeadline = null;
function updateLiveBits() {
  if (S.phase === "lobby") { live.players?.(); live.hostBits?.(); return; }
  const side = $app.querySelector("aside");
  if (side) side.replaceWith(sidebar());
  live.writeStatus?.();
  if (S.deadline !== lastDeadline && live.header) { timerEls = []; const nh = header(); live.header.replaceWith(nh); live.header = nh; }
}

// ---------- LOBBY ----------
function lobbyScreen(main) {
  live = {};
  const link = `${location.origin}/${S.code}`;
  const playersBox = h("div", { class: "lobby-players" });
  const countLabel = h("div", { class: "label", style: "margin-bottom:10px" });
  live.players = () => {
    countLabel.textContent = `Joueurs (${S.players.length}/12)`;
    playersBox.replaceChildren(...S.players.map((p) =>
      h("div", { class: "lp", style: p.connected ? "" : "opacity:.45" },
        isHost() && p.id !== S.me ? h("button", { class: "kick", title: "Retirer", onclick: () => confirm(`Retirer ${p.name} ?`) && act("kick", { target: p.id }) }, "✕") : null,
        avatarEl(p, "lg", { crown: p.id === S.hostId }),
        h("span", { class: "pname" }, p.name + (p.id === S.me ? " (toi)" : ""))
      )
    ));
  };
  live.players();

  const st = S.settings;
  const num = (key, label, min, max) => {
    const inp = h("input", { class: "field", type: "number", min, max, value: st[key], disabled: !isHost(), "data-k": key });
    inp.addEventListener("change", pushSettings);
    return h("label", {}, label, inp);
  };
  const area = (type, label, ph) => {
    const ta = h("textarea", { class: "field", style: "min-height:80px;font-size:14px", placeholder: ph, disabled: !isHost(), "data-c": type });
    ta.value = (st.custom?.[type] || []).join("\n");
    ta.addEventListener("change", pushSettings);
    return h("label", {}, label, ta);
  };
  const settingsBox = h("div", { class: "settings" },
    num("anecdoteRounds", "Manches anecdotes", 0, 10),
    num("quiRounds", "Manches « qui est le plus »", 0, 15),
    num("ouinonRounds", "Manches oui / non", 0, 15),
    num("writeTime", "Temps pour écrire (s)", 20, 300),
    num("guessTime", "Temps pour deviner (s)", 10, 120),
    num("voteTime", "Temps pour voter (s)", 10, 120),
  );
  const customBox = h("details", {},
    h("summary", {}, "✏️ Ajouter vos propres questions (une par ligne)"),
    h("div", { class: "settings", style: "grid-template-columns:1fr" },
      area("anecdote", "Thèmes d'anecdotes", "Ex : Ta pire soirée en BTS"),
      area("qui", "Qui est le plus…", "Ex : Qui est le plus susceptible de rater son train ?"),
      area("ouinon", "Questions oui / non", "Ex : As-tu déjà dormi en cours ?"),
    )
  );
  function pushSettings() {
    const s = { custom: {} };
    main.querySelectorAll("[data-k]").forEach((i) => (s[i.dataset.k] = i.value));
    main.querySelectorAll("[data-c]").forEach((t) => (s.custom[t.dataset.c] = t.value));
    act("settings", { settings: s });
  }

  const startBtn = h("button", { class: "btn", style: "font-size:22px;padding:14px 34px" }, "Lancer la partie");
  startBtn.onclick = () => act("start");
  const hostInfo = h("div", { class: "center muted" });
  live.hostBits = () => {
    const n = S.players.filter((p) => p.connected).length;
    startBtn.hidden = !isHost();
    startBtn.disabled = n < S.minPlayers;
    hostInfo.textContent = isHost()
      ? (n < S.minPlayers ? `Encore ${S.minPlayers - n} joueur(s) minimum pour lancer…` : "Tout le monde est là ? Go !")
      : `En attente que ${player(S.hostId).name} lance la partie…`;
    if (!isHost()) {
      main.querySelectorAll("[data-k]").forEach((i) => (i.value = S.settings[i.dataset.k], i.disabled = true));
      main.querySelectorAll("[data-c]").forEach((t) => (t.value = (S.settings.custom?.[t.dataset.c] || []).join("\n"), t.disabled = true));
    }
  };

  main.append(
    h("div", { class: "center" },
      h("div", { class: "label" }, "Code de la salle"),
      h("p", { class: "code-big" }, S.code),
      h("div", { class: "row center", style: "margin:6px 0 18px" },
        h("button", { class: "btn blue small", onclick: () => navigator.clipboard?.writeText(link).then(() => toast("Lien copié ! Envoie-le à tes potes 📨")) }, "📋 Copier le lien"),
        h("button", { class: "btn ghost small", onclick: () => leave() }, "Quitter")
      )
    ),
    countLabel,
    playersBox,
    h("div", { style: "margin-top:20px" }, h("div", { class: "label", style: "margin-bottom:8px" }, "Réglages"), settingsBox, customBox),
    h("div", { class: "row center", style: "margin-top:20px;flex-direction:column" }, startBtn, hostInfo)
  );
  live.hostBits();
}

// ---------- ÉCRIRE UNE ANECDOTE ----------
function writeScreen(main) {
  live = {};
  const ta = h("textarea", { class: "field", maxlength: S.maxAnecdote, placeholder: "Raconte ton anecdote… (anonyme jusqu'à la fin !)" });
  ta.value = S.myText || "";
  const counter = h("div", { class: "label center", style: "margin:8px 0 14px" });
  const upd = () => (counter.textContent = `${S.maxAnecdote - ta.value.length} caractères restants`);
  ta.addEventListener("input", upd); upd();
  const btn = h("button", { class: "btn" }, "👍 Valider mon anecdote");
  const status = h("div", { class: "center muted", style: "margin-top:10px" });
  btn.onclick = () => { if (ta.value.trim()) act("submit", { text: ta.value }); else toast("Écris quelque chose !"); };
  live.writeStatus = () => {
    const mine = (S.done || []).includes(S.me);
    btn.textContent = mine ? "✏️ Modifier mon anecdote" : "👍 Valider mon anecdote";
    const n = S.done.length, tot = S.players.filter((p) => p.connected).length;
    status.textContent = (mine ? "✅ Anecdote envoyée ! " : "") + `${n}/${tot} joueurs ont répondu`;
  };
  live.writeStatus();
  live.header = header();
  main.append(
    live.header,
    h("div", { class: "label center", style: "margin-top:16px" }, "Thème"),
    h("div", { class: "question" }, S.round.question),
    h("div", { class: "label", style: "margin-bottom:6px" }, "Ton anecdote"),
    ta, counter,
    h("div", { class: "row center" }, btn),
    status
  );
  setTimeout(() => ta.focus(), 50);
}

// ---------- DEVINER L'AUTEUR ----------
function guessScreen(main) {
  live = {};
  const a = S.anecdote;
  const grid = h("div", { class: "players-pick" },
    S.players.map((p) =>
      h("button", {
        class: S.myVote === p.id ? "sel" : "",
        disabled: S.isMine,
        onclick: () => act("guess", { anecdoteId: a.id, target: p.id }),
      }, avatarEl(p), h("span", { class: "pname" }, p.name + (p.id === S.me ? " (toi)" : "")))
    )
  );
  const waiting = S.waitingFor.length;
  const voted = S.done.length;
  main.append(
    header(),
    h("div", { class: "label center", style: "margin-top:16px" }, `Anecdote ${a.index}/${a.total} · « ${S.round.question} »`),
    h("div", { class: "question", style: "font-size:clamp(20px,3vw,30px)" }, "À qui appartient cette anecdote ?"),
    h("div", { class: "anec-card" }, a.text),
    S.isMine
      ? h("p", { class: "center", style: "font-size:18px" }, "🤫 C'est la tienne ! Fais genre de rien…")
      : h("p", { class: "center muted" }, S.myVote ? `Tu as voté pour ${player(S.myVote).name} (tu peux changer)` : "Clique sur un joueur"),
    grid,
    h("p", { class: "center muted" }, `${voted}/${waiting} votes`)
  );
}

// ---------- RÉVÉLATION DES ANECDOTES ----------
function anecRevealScreen(main) {
  live = {};
  const pts = S.roundPoints || {};
  const cards = S.anecdotes.map((a) => {
    const author = player(a.author);
    const right = a.votes.filter((v) => v.target === a.author).length;
    return h("div", { class: "reveal-card fade-in" },
      h("div", { class: "txt" }, `« ${a.text} »`),
      h("div", { class: "row" }, avatarEl(author, "sm"), h("b", {}, `C'était ${author.name} !`), h("span", { class: "muted" }, ` · ${right}/${a.votes.length} ont trouvé`)),
      h("div", { class: "row", style: "gap:6px" },
        a.votes.length ? a.votes.map((v) => {
          const voter = player(v.voter), target = player(v.target), ok = v.target === a.author;
          return h("div", { class: "vote-line " + (ok ? "ok" : "ko") }, avatarEl(voter, "sm"), " → ", avatarEl(target, "sm"), ok ? " ✅" : " ❌");
        }) : h("span", { class: "muted" }, "Personne n'a voté")
      )
    );
  });
  const gains = S.players.filter((p) => pts[p.id]).sort((a, b) => pts[b.id] - pts[a.id]);
  main.append(
    h("div", { class: "topbar" }, h("span", { class: "chip" }, `Manche ${S.roundNum}/${S.totalRounds} · Révélations`)),
    h("div", { class: "question", style: "margin-top:14px" }, S.round.question),
    S.anecdotes.length ? h("div", { style: "display:grid;gap:12px" }, cards) : h("p", { class: "center muted" }, "Personne n'a écrit d'anecdote… 🦗"),
    gains.length ? h("div", { class: "row center", style: "margin-top:16px;gap:14px" },
      gains.map((p) => h("div", { class: "row", style: "gap:6px" }, avatarEl(p, "sm"), h("span", { class: "pixel" }, `+${pts[p.id]}`)))) : null,
    h("p", { class: "center muted", style: "font-size:13px" }, "+1 par bonne réponse · +1 pour l'auteur par joueur trompé"),
    nextButton()
  );
}

function nextButton() {
  return h("div", { class: "row center", style: "margin-top:18px" },
    isHost()
      ? h("button", { class: "btn", onclick: () => act("next") }, S.roundNum >= S.totalRounds ? "Voir les résultats 🏆" : "Manche suivante ▶")
      : h("span", { class: "muted" }, `${player(S.hostId).name} passe à la suite…`)
  );
}

// ---------- VOTE (qui / oui-non) ----------
function voteScreen(main) {
  live = {};
  main.append(header(), h("div", { class: "question", style: "margin-top:22px" }, S.round.question));
  if (S.round.type === "qui") {
    main.append(h("div", { class: "players-pick" },
      S.players.map((p) => h("button", { class: S.myVote === p.id ? "sel" : "", onclick: () => act("vote", { target: p.id }) },
        avatarEl(p), h("span", { class: "pname" }, p.name + (p.id === S.me ? " (toi)" : ""))))
    ), h("p", { class: "center muted" }, "⚠️ Les votes seront révélés : tout le monde saura qui a voté pour qui !"));
  } else {
    main.append(
      h("div", { class: "yn" },
        h("button", { class: "oui" + (S.myVote === "oui" ? " sel" : ""), onclick: () => act("vote", { target: "oui" }) }, "Oui"),
        h("button", { class: "non" + (S.myVote === "non" ? " sel" : ""), onclick: () => act("vote", { target: "non" }) }, "Non")
      ),
      h("p", { class: "center muted" }, "🔒 Vote anonyme : seul le total sera affiché.")
    );
  }
  const tot = S.players.filter((p) => p.connected).length;
  main.append(h("p", { class: "center muted" }, `${S.done.length}/${tot} ont voté`));
}

// ---------- RÉSULTATS DES VOTES ----------
function voteRevealScreen(main) {
  live = {};
  main.append(
    h("div", { class: "topbar" }, h("span", { class: "chip" }, `Manche ${S.roundNum}/${S.totalRounds} · Résultats`)),
    h("div", { class: "question", style: "margin-top:18px" }, S.round.question)
  );
  if (S.round.type === "qui") {
    const t = S.tally || {};
    const max = Math.max(0, ...Object.values(t).map((v) => v.length));
    const cols = [...S.players].sort((a, b) => (t[b.id]?.length || 0) - (t[a.id]?.length || 0));
    main.append(h("div", { class: "tally" }, cols.map((p) => {
      const voters = t[p.id] || [];
      const top = max > 0 && voters.length === max;
      return h("div", { class: "col fade-in" + (top ? " top" : "") },
        avatarEl(p, "lg", { crown: top }),
        h("span", { class: "pname" }, p.name),
        h("span", { class: "count" }, voters.length),
        h("div", { class: "mini-row" }, voters.map((id) => avatarEl(player(id), "sm")))
      );
    })));
  } else {
    const { oui, non } = S.counts;
    const total = Math.max(1, oui + non);
    const bar = (label, n, color) => {
      const fill = h("div", { style: `width:0;background:${color}` });
      requestAnimationFrame(() => requestAnimationFrame(() => (fill.style.width = (n / total) * 100 + "%")));
      return h("div", { class: "bar-row" }, h("span", { class: "n" }, n), h("span", {}, label), h("div", { class: "bar" }, fill));
    };
    main.append(h("div", { class: "bars" }, bar("oui", oui, "var(--green)"), bar("non", non, "var(--red)")),
      h("p", { class: "center muted" }, oui && oui < total ? "👀 Alors… c'est qui ?" : ""));
  }
  main.append(nextButton());
}

// ---------- FIN ----------
function endScreen(main) {
  live = {};
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const medals = ["🥇", "🥈", "🥉"];
  main.append(
    h("div", { class: "center" }, h("div", { class: "label" }, "Fin de la partie"), h("h1", { class: "title" }, "CLASSEMENT")),
    h("div", { class: "podium" }, ranked.map((p, i) =>
      h("div", { class: "pr fade-in" + (i === 0 ? " first" : "") },
        h("span", { class: "rank" }, medals[i] || i + 1),
        avatarEl(p),
        h("div", {},
          h("div", { class: "pname" }, p.name),
          (S.titles?.[p.id] || []).length ? h("div", { class: "muted", style: "font-size:12px" }, "🏷 " + S.titles[p.id].join(" · ")) : null
        ),
        h("span", { class: "pts" }, p.score + " pts")
      )
    )),
    h("div", { class: "row center", style: "margin-top:22px" },
      isHost() ? h("button", { class: "btn", onclick: () => act("start") }, "Rejouer 🔁") : null,
      isHost() ? h("button", { class: "btn blue", onclick: () => act("lobby") }, "Retour au salon") : h("span", { class: "muted" }, "L'hôte peut relancer une partie"),
      h("button", { class: "btn ghost", onclick: () => leave() }, "Quitter")
    )
  );
}

// ================== démarrage ==================
if (session) {
  const urlCode = location.pathname.slice(1).toUpperCase();
  if (urlCode && urlCode !== session.code) { localStorage.removeItem("qadc_session"); session = null; renderHome(); }
  else { history.replaceState(null, "", "/" + session.code); connect(); }
} else renderHome();
</script>
</body>
</html>
