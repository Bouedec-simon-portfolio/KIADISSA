<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KIADISSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #5b6fd6; --bg2: #4a55b8; --panel: #2f3a86; --panel2: #3b479d; --line: #8fb0ff;
    --text: #f4f6ff; --muted: #b9c3f5; --green: #4ade80; --red: #f87171; --gold: #ffd43b;
    --pixel: "Pixelify Sans", ui-monospace, monospace; --body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--body); color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg1), var(--bg2) 70%) fixed;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  .pixel { font-family: var(--pixel); letter-spacing: .02em; }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  .app.with-side { grid-template-columns: 1fr 230px; }
  @media (max-width: 800px) { .app.with-side { grid-template-columns: 1fr; } .side { order: 2; } }

  .panel { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 2px solid color-mix(in srgb, var(--line) 50%, transparent); border-radius: 14px; padding: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.18); }
  .center { text-align: center; }
  h1.title { font-family: var(--pixel); font-size: clamp(34px, 7vw, 64px); margin: 8px 0 4px; text-shadow: 0 4px 0 rgba(0,0,0,.25); line-height: 1.05; }
  .label { font-family: var(--pixel); font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .12em; }
  .question { font-family: var(--pixel); font-size: clamp(24px, 4.2vw, 42px); text-transform: uppercase; text-align: center; margin: 6px 0 18px; line-height: 1.15; text-shadow: 0 3px 0 rgba(0,0,0,.25); }

  .btn { font-family: var(--pixel); font-size: 18px; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; background: #7bc47f; color: #10301a; box-shadow: 0 5px 0 #3e7d44; transition: transform .05s; text-transform: uppercase; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3e7d44; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.blue { background: #8fb0ff; color: #12204f; box-shadow: 0 5px 0 #4e64b8; }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: none; border: 2px solid var(--line); }
  .btn.small { font-size: 14px; padding: 7px 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row.center { justify-content: center; }

  input.field, textarea.field, select.field { width: 100%; background: #313f90; border: 2px solid var(--line); border-radius: 8px; padding: 12px; outline: none; }
  input.field:focus, textarea.field:focus { border-color: #fff; }
  textarea.field { min-height: 130px; resize: vertical; font-size: 18px; }

  .avatar { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; border: 3px solid rgba(255,255,255,.85); flex: none; position: relative; }
  .avatar.sm { width: 26px; height: 26px; font-size: 14px; border-width: 2px; border-radius: 7px; }
  .avatar.lg { width: 74px; height: 74px; font-size: 42px; border-radius: 16px; }
  .pname { font-family: var(--pixel); text-transform: uppercase; font-size: 14px; }

  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
  .pick-grid button { border: 2px solid transparent; background: #3b479d; border-radius: 10px; font-size: 24px; padding: 6px; cursor: pointer; }
  .pick-grid button.sel { border-color: #fff; background: #5566c5; }
  .colors button { height: 34px; }

  .side .plist { display: grid; gap: 8px; }
  .side .pl { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.05); }
  .side .pl.off { opacity: .45; }
  .side .pl .score { margin-left: auto; font-family: var(--pixel); background: #8fd3ff; color: #12204f; border-radius: 8px; padding: 1px 8px; min-width: 28px; text-align: center; }
  .done-badge { position: absolute; right: -6px; bottom: -6px; background: var(--green); color: #0b3; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; display: grid; place-items: center; color: #053; border: 2px solid #fff; }
  .crown { position: absolute; top: -12px; left: -6px; font-size: 16px; }

  .timer { height: 10px; background: rgba(0,0,0,.25); border-radius: 6px; overflow: hidden; margin: 6px 0 2px; }
  .timer > div { height: 100%; background: linear-gradient(90deg, #8fd3ff, #ffd43b); transition: width .25s linear; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chip { font-family: var(--pixel); font-size: 13px; background: rgba(0,0,0,.2); border-radius: 999px; padding: 4px 12px; }

  .players-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 10px; }
  .players-pick button { background: #3b479d; border: 3px solid transparent; border-radius: 14px; padding: 12px 6px; cursor: pointer; display: grid; justify-items: center; gap: 8px; }
  .players-pick button:hover:not(:disabled) { background: #4a58b5; }
  .players-pick button.sel { border-color: var(--gold); background: #5566c5; }
  .players-pick button:disabled { cursor: default; }

  .anec-card { background: #313f90; border: 2px solid var(--line); border-radius: 12px; padding: 22px; font-size: clamp(18px, 2.6vw, 24px); line-height: 1.4; text-align: center; white-space: pre-wrap; word-break: break-word; }
  .reveal-card { background: #313f90; border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
  .reveal-card .txt { white-space: pre-wrap; word-break: break-word; }
  .vote-line { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 3px 8px; border-radius: 8px; }
  .vote-line.ok { background: rgba(74,222,128,.18); }
  .vote-line.ko { background: rgba(248,113,113,.15); }

  .tally { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-top: 10px; }
  .tally .col { display: grid; justify-items: center; gap: 6px; min-width: 84px; }
  .tally .count { font-family: var(--pixel); background: #8fd3ff; color: #12204f; border-radius: 8px; padding: 2px 12px; }
  .tally .col.top .count { background: var(--gold); }
  .mini-row { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 110px; }

  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 520px; margin: 0 auto; }
  .yn button { font-family: var(--pixel); font-size: 32px; padding: 28px; border-radius: 16px; border: 4px solid transparent; cursor: pointer; text-transform: uppercase; }
  .yn .oui { background: #2f9e5e; } .yn .non { background: #c94a4a; }
  .yn button.sel { border-color: #fff; transform: scale(1.03); }
  .bars { max-width: 560px; margin: 0 auto; background: #2a3580; border: 2px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
  .bar-row { display: grid; grid-template-columns: 44px 60px 1fr; align-items: center; gap: 10px; font-family: var(--pixel); text-transform: uppercase; }
  .bar-row .n { background: #8fd3ff; color: #12204f; border-radius: 8px; text-align: center; padding: 2px 0; }
  .bar { height: 14px; background: rgba(0,0,0,.25); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; transition: width .8s ease; }

  .code-big { font-family: var(--pixel); font-size: clamp(44px, 10vw, 86px); letter-spacing: .15em; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .lobby-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .lobby-players .lp { background: #3b479d; border-radius: 12px; padding: 12px; display: grid; justify-items: center; gap: 6px; position: relative; }
  .lp .kick { position: absolute; top: 4px; right: 6px; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 16px; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .settings label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; font-family: var(--pixel); color: var(--muted); margin: 8px 0; }
  .muted { color: var(--muted); }
  .err { color: #ffd0d0; min-height: 1.3em; text-align: center; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1e2766; border: 2px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 10; }
  .podium { display: grid; gap: 8px; max-width: 520px; margin: 0 auto; }
  .podium .pr { display: flex; align-items: center; gap: 12px; background: #3b479d; border-radius: 12px; padding: 10px 14px; }
  .podium .pr.first { background: linear-gradient(90deg, #b8860b, #3b479d 70%); }
  .podium .rank { font-family: var(--pixel); font-size: 22px; width: 34px; }
  .podium .pts { margin-left: auto; font-family: var(--pixel); font-size: 20px; }
  body.hot { background: radial-gradient(ellipse at top, #c2416b, #6a1f5c 70%) fixed; }
  body.hot .panel { background: color-mix(in srgb, #4a1640 85%, transparent); border-color: rgba(255,140,170,.5); }
  .hot-chip { background: #ff4d6d; color: #fff; }
  body.hot input.field, body.hot textarea.field, body.hot select.field, body.hot .anec-card, body.hot .reveal-card, body.hot .bars { background: #5c1d4f; border-color: #ff8fab; }
  body.hot .lobby-players .lp, body.hot .players-pick button, body.hot .podium .pr, body.hot .pick-grid button { background: #6e2860; }
  body.hot .players-pick button:hover:not(:disabled) { background: #85306f; }
  .fade-in { animation: fade .35s ease; }
  main.panel:not(.fade-in) .fade-in { animation: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 760px; margin: 0 auto; }
  @media (max-width: 600px) { .opt-grid { grid-template-columns: 1fr; } }
  .opt-btn { font-family: var(--pixel); font-size: clamp(18px, 2.6vw, 24px); padding: 26px 18px; border-radius: 16px; border: 4px solid transparent; cursor: pointer; line-height: 1.2; color: #fff; }
  .opt-btn.a { background: #3b82c4; } .opt-btn.b { background: #c4673b; }
  .opt-btn.did { background: #b8860b; } .opt-btn.never { background: #4b6bcf; }
  .opt-btn.sel { border-color: #fff; transform: scale(1.03); }
  .vs { font-family: var(--pixel); text-align: center; font-size: 20px; color: var(--muted); }
  .stmt { display: grid; gap: 10px; max-width: 700px; margin: 0 auto; }
  .stmt button, .stmt .s { text-align: left; background: #313f90; border: 3px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 18px; cursor: pointer; display: flex; gap: 10px; align-items: center; word-break: break-word; }
  .stmt button.sel { border-color: var(--gold); background: #4a58b5; }
  .stmt .s.lie { border-color: var(--red); background: rgba(248,113,113,.18); }
  .stmt .s.true { border-color: rgba(74,222,128,.6); }
  .stmt .num { font-family: var(--pixel); background: rgba(0,0,0,.25); border-radius: 8px; padding: 2px 9px; flex: none; }
  .menteur-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .lie-pick { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .lie-pick input { width: 18px; height: 18px; accent-color: var(--red); }
  .answers { display: grid; gap: 10px; max-width: 700px; margin: 0 auto; }
  .answers button { background: #313f90; border: 3px solid var(--line); border-radius: 12px; padding: 14px; font-size: 18px; cursor: pointer; text-align: center; word-break: break-word; }
  .answers button.sel { border-color: var(--gold); background: #4a58b5; }
  .answers button.mine { opacity: .55; cursor: default; border-style: dashed; }
  .toggle { display: inline-flex; gap: 8px; align-items: center; background: rgba(0,0,0,.2); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: var(--pixel); border: 2px solid transparent; }
  .toggle.on { border-color: var(--gold); background: rgba(255,212,59,.18); }
  .stepper { display: inline-flex; align-items: center; gap: 10px; background: rgba(0,0,0,.2); border-radius: 12px; padding: 6px 10px; }
  .stepper button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: #8fb0ff; color: #12204f; font-size: 20px; cursor: pointer; font-weight: 800; }
  .stepper .val { font-family: var(--pixel); font-size: 26px; min-width: 36px; text-align: center; }
  .packs { display: flex; gap: 8px; flex-wrap: wrap; }
  .pack { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-family: var(--pixel); }
  .pack.on { background: #8fb0ff; color: #12204f; }
  .pack.hot.on { background: #ff4d6d; color: #fff; border-color: #ff4d6d; }
  .pack:disabled { cursor: default; }
  .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .two-cols { grid-template-columns: 1fr; } }
  .col-box { background: #313f90; border-radius: 12px; padding: 14px; display: grid; gap: 10px; align-content: start; }
  .col-box h3 { margin: 0; font-family: var(--pixel); font-size: 18px; }
  .col-box.win { outline: 3px solid var(--gold); }
  .chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .ptag { display: inline-flex; gap: 6px; align-items: center; background: rgba(0,0,0,.2); border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 13px; }
  .titles { display: grid; gap: 8px; max-width: 560px; margin: 16px auto 0; }
  .title-row { display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,.2); border-radius: 12px; padding: 8px 12px; }
  .title-row .t { font-family: var(--pixel); }
  .gage { max-width: 560px; margin: 18px auto 0; background: linear-gradient(135deg, #7a2d8f, #c2416b); border-radius: 14px; padding: 16px; text-align: center; }
  .gage .g-title { font-family: var(--pixel); font-size: 22px; margin-bottom: 8px; }

  /* réactions + joker */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .float-emo { position: absolute; bottom: -60px; font-size: 42px; animation: floatUp 2.6s ease-out forwards; display: flex; flex-direction: column; align-items: center; }
  .float-emo small { font-size: 11px; font-family: var(--pixel); background: rgba(0,0,0,.35); border-radius: 6px; padding: 1px 5px; color: #fff; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-80px) scale(1.1); } 100% { transform: translateY(-75vh) scale(1); opacity: 0; } }
  .react-bar { position: fixed; right: 12px; bottom: 12px; z-index: 15; display: flex; gap: 4px; background: rgba(20,26,80,.85); border: 2px solid var(--line); border-radius: 999px; padding: 4px 8px; }
  .react-bar button { background: none; border: 0; font-size: 22px; cursor: pointer; padding: 4px; border-radius: 50%; transition: transform .1s; }
  .react-bar button:active { transform: scale(1.4); }
  @media (max-width: 600px) { .react-bar { left: 50%; right: auto; transform: translateX(-50%); } .react-bar button { font-size: 20px; padding: 2px; } body.in-room .app { padding-bottom: 70px; } }
  .corner { position: fixed; top: 10px; right: 12px; z-index: 15; display: flex; gap: 6px; }
  .corner button { background: rgba(20,26,80,.8); border: 2px solid var(--line); border-radius: 10px; font-size: 18px; padding: 4px 8px; cursor: pointer; }
  .joker-banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); z-index: 30; background: linear-gradient(135deg, #ffd43b, #ff8f3b); color: #2a1300; border-radius: 18px; padding: 22px 28px; text-align: center; font-family: var(--pixel); box-shadow: 0 10px 40px rgba(0,0,0,.4); animation: pop 4.5s ease forwards; max-width: 90vw; }
  .joker-banner .big { font-size: clamp(22px, 4vw, 34px); }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 8% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 12% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
  .joker-pick { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .joker-pick button { background: rgba(0,0,0,.25); border: 2px solid transparent; border-radius: 12px; padding: 6px 10px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .joker-pick button:hover { border-color: var(--gold); }
  .spec-banner { background: rgba(0,0,0,.3); border-radius: 10px; padding: 8px 12px; text-align: center; font-family: var(--pixel); }
  body.spectator .act { pointer-events: none !important; opacity: .55; }
  [hidden] { display: none !important; }
  .photo-btns { display: flex; gap: 6px; flex-direction: column; }
</style>

<body>
<div id="app" class="app"></div>
<div id="fx"></div>
<div id="toast" class="toast" hidden></div>

<script>
// append / replaceChildren natifs affichent "null" : on filtre les valeurs vides
for (const fn of ["append", "replaceChildren"]) {
  const orig = Element.prototype[fn];
  Element.prototype[fn] = function (...kids) { return orig.apply(this, kids.filter((k) => k != null && k !== false)); };
}
// ================== état client ==================
const AVATARS = ["🦊","🐸","🐼","🐙","🦄","🐲","👽","🤖","👻","🐵","🦁","🐧","🍕","🌵","💀","🤡","🐱","🐶","🦖","🐝"];
const COLORS = ["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#38d9a9","#4dabf7","#748ffc","#da77f2","#f783ac","#adb5bd"];
const TYPE_LABEL = {
  anecdote: "Anecdote", menteur: "Le menteur", qui: "Qui est le plus…", ouinon: "Oui ou non",
  tuprefs: "Tu préfères…", phrase: "Complète la phrase", jamais: "Je n'ai jamais", connais: "Qui me connaît ?",
};
const TYPE_SETTINGS = [
  ["anecdote", "📝 Anecdotes"], ["menteur", "🤥 Le menteur"], ["qui", "👉 Qui est le plus…"], ["ouinon", "✅ Oui / Non"],
  ["tuprefs", "🤔 Tu préfères…"], ["phrase", "😂 Complète la phrase"], ["jamais", "🍺 Je n'ai jamais"], ["connais", "🧠 Qui me connaît ?"],
];
const CUSTOM_FIELDS = [
  ["anecdote", "Thèmes d'anecdotes", "Ex : Ta pire soirée en BTS"],
  ["qui", "Qui est le plus…", "Ex : Qui est le plus susceptible de rater son train ?"],
  ["ouinon", "Questions oui / non", "Ex : As-tu déjà dormi en cours ?"],
  ["tuprefs", "Tu préfères (format : option A | option B)", "Ex : Pizza | Burger"],
  ["phrase", "Phrases à compléter", "Ex : Le pire prof du monde ferait…"],
  ["jamais", "Je n'ai jamais…", "Ex : Je n'ai jamais raté le bus"],
];

const saved = JSON.parse(localStorage.getItem("qadc_profile") || "{}");
let profile = {
  name: saved.name || "",
  avatar: saved.avatar || AVATARS[Math.floor(Math.random() * AVATARS.length)],
  color: saved.color || COLORS[Math.floor(Math.random() * COLORS.length)],
  photo: saved.photo || null,
};
let session = JSON.parse(localStorage.getItem("qadc_session") || "null"); // {code, pid, spectator}
let S = null;            // dernière vue reçue du serveur
let clockOffset = 0;     // serveur - client
let es = null;
let screenKey = "";
let muted = localStorage.getItem("qadc_muted") === "1";
const $app = document.getElementById("app");
const $fx = document.getElementById("fx");

// ================== helpers DOM ==================
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const player = (id) => S?.players.find((p) => p.id === id) || { id, name: "???", avatar: "❔", color: "#888", score: 0 };
function avatarEl(p, size = "", extra = {}) {
  const el = h("div", { class: `avatar ${size}`, style: `background:${p.color}`, title: p.name },
    p.photo ? h("img", { src: p.photo, alt: "" }) : p.avatar);
  if (extra.crown) el.append(h("span", { class: "crown" }, "👑"));
  if (extra.done) el.append(h("span", { class: "done-badge" }, "✓"));
  return el;
}
const ptag = (id) => { const p = player(id); return h("span", { class: "ptag" }, avatarEl(p, "sm"), p.name); };
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Erreur");
  return data;
}
async function act(type, extra = {}) {
  try { await post("/api/action", { code: session.code, pid: session.pid, type, ...extra }); }
  catch (e) { toast(e.message); }
}
const isHost = () => S && S.hostId === S.me;
const me = () => S?.players.find((p) => p.id === S.me);
const activeCount = () => S.players.filter((p) => p.connected).length;

// ================== sons (générés, aucun fichier) ==================
let audioCtx = null;
function beep(freq, dur = 0.12, type = "square", vol = 0.05, delay = 0) {
  if (muted) return;
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch {}
}
const SFX = {
  tick: () => beep(880, 0.05, "square", 0.03),
  reveal: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.18, "triangle", 0.06, i * 0.09)),
  pop: () => beep(600 + Math.random() * 400, 0.06, "sine", 0.04),
  click: () => beep(440, 0.05, "triangle", 0.04),
  joker: () => [392, 523, 659, 784, 659, 784].forEach((f, i) => beep(f, 0.16, "sawtooth", 0.04, i * 0.1)),
  start: () => [330, 440, 554, 660].forEach((f, i) => beep(f, 0.14, "square", 0.04, i * 0.08)),
};

// ================== connexion ==================
function connect() {
  if (es) es.close();
  document.body.classList.add("in-room");
  document.body.classList.toggle("spectator", !!session.spectator);
  es = new EventSource(`/events?code=${encodeURIComponent(session.code)}&pid=${encodeURIComponent(session.pid)}`);
  es.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.kicked) { leave("Tu as été retiré de la salle."); return; }
    clockOffset = data.now - Date.now();
    const prevPhase = S?.phase;
    S = data;
    if (prevPhase !== S.phase) {
      if (S.phase === "reveal" || S.phase === "end") SFX.reveal();
      if (prevPhase === "lobby" && S.phase !== "lobby") SFX.start();
    }
    render();
  };
  es.addEventListener("fx", (ev) => onFx(JSON.parse(ev.data)));
  es.onerror = async () => {
    if (!session) return;
    try {
      const r = await fetch(`/api/check?code=${encodeURIComponent(session.code)}&pid=${encodeURIComponent(session.pid)}`);
      if (r.status === 404) leave("La salle n'existe plus.");
    } catch {}
  };
  renderChrome();
}
function leave(msg) {
  if (es) es.close();
  es = null; S = null; session = null; screenKey = "";
  localStorage.removeItem("qadc_session");
  document.body.classList.remove("hot", "in-room", "spectator");
  history.replaceState(null, "", "/");
  renderChrome();
  renderHome();
  if (msg) toast(msg);
}

// ================== réactions + joker (effets) ==================
function onFx(fx) {
  if (fx.type === "react") {
    const who = S?.players.find((p) => p.id === fx.from)?.name || S?.spectators?.find((s) => s.id === fx.from)?.name || "";
    const el = h("div", { class: "float-emo", style: `left:${8 + Math.random() * 84}%` }, fx.emoji, who ? h("small", {}, who) : null);
    $fx.append(el);
    setTimeout(() => el.remove(), 2700);
    SFX.pop();
  } else if (fx.type === "joker") {
    const from = player(fx.from), to = player(fx.target);
    const el = h("div", { class: "joker-banner" },
      h("div", { style: "font-size:46px" }, "🃏"),
      h("div", { class: "big" }, `${from.name} sort son JOKER !`),
      h("div", { style: "margin-top:8px;font-size:20px" }, `${to.name}, raconte-nous l'histoire 🎤`));
    document.body.append(el);
    setTimeout(() => el.remove(), 4600);
    SFX.joker();
  }
}

function renderChrome() {

// ================== photo de profil ==================
function pickPhoto(cb) {
  const input = h("input", { type: "file", accept: "image/*" });
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const size = 128, c = document.createElement("canvas");
      c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      cb(c.toDataURL("image/jpeg", 0.8));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => toast("Image illisible");
    img.src = URL.createObjectURL(file);
  };
  input.click();
}

  screenKey = "home";

  const photoBtns = h("div", { class: "photo-btns" });
  function refresh() {
    avGrid.replaceChildren(...AVATARS.map((a) => h("button", { class: a === profile.avatar && !profile.photo ? "sel" : "", onclick: () => { profile.avatar = a; profile.photo = null; refresh(); } }, a)));
    colGrid.replaceChildren(...COLORS.map((c) => h("button", { class: c === profile.color ? "sel" : "", style: `background:${c}`, onclick: () => { profile.color = c; refresh(); }, "aria-label": c })));
    preview.replaceChildren(avatarEl(profile, "lg"));

      profile.photo ? h("button", { class: "btn ghost small", onclick: () => { profile.photo = null; refresh(); } }, "✕") : null
    );
  }
  refresh();

  function saveProfile() {
    profile.name = nameIn.value.trim();
    try { localStorage.setItem("qadc_profile", JSON.stringify(profile)); } catch {}
    if (!profile.name) { err.textContent = "Choisis un pseudo !"; nameIn.focus(); return false; }
    return true;
  }
  async function start(kind) {
    err.textContent = "";
    if (!saveProfile()) return;
    try {
      const code = codeIn.value.trim().toUpperCase();
      if (kind !== "create" && !/^[A-Z]{4}$/.test(code)) { err.textContent = "Entre le code de la salle (4 lettres)."; return; }
      const data = kind === "create"
        ? await post("/api/create", profile)
        : await post("/api/join", { ...profile, code, spectate: kind === "spectate" });
      session = { code: data.code, pid: data.pid, spectator: !!data.spectator };
      localStorage.setItem("qadc_session", JSON.stringify(session));
      history.replaceState(null, "", "/" + data.code);
      connect();
    } catch (e) { err.textContent = e.message; }
  }
  nameIn.addEventListener("keydown", (e) => e.key === "Enter" && (codeIn.value ? start("join") : start("create")));
  codeIn.addEventListener("keydown", (e) => e.key === "Enter" && start("join"));

  $app.replaceChildren(
    h("div", { class: "center fade-in" },
      h("div", { class: "label", style: "margin-top:20px" }, "party game entre potes"),
      h("h1", { class: "title" }, "KIADISSA"),
      h("p", { class: "muted" }, "Anecdotes, votes et révélations gênantes. 3 à 12 joueurs.")
    ),
    h("div", { class: "panel fade-in", style: "max-width:560px;margin:0 auto;width:100%;display:grid;gap:14px" },
      h("div", { class: "row", style: "flex-wrap:nowrap" }, preview, nameIn, photoBtns),
      h("div", {}, h("div", { class: "label", style: "margin-bottom:6px" }, "Avatar"), avGrid),
      h("div", {}, h("div", { class: "label", style: "margin-bottom:6px" }, "Couleur"), colGrid),
      h("div", { class: "row", style: "flex-wrap:nowrap;margin-top:6px" }, codeIn, h("button", { class: "btn blue", onclick: () => start("join") }, "Rejoindre")),
      h("div", { class: "center" }, h("button", { class: "btn ghost small", onclick: () => start("spectate") }, "👀 Regarder en spectateur")),
      h("div", { class: "center muted" }, "— ou —"),
      h("button", { class: "btn", onclick: () => start("create") }, "Créer une salle"),
      err
    )
  );
  if (urlCode) codeIn.style.borderColor = "#fff";
  if (location.protocol === "file:") {
    err.innerHTML = "⚠️ Tu as ouvert le fichier directement. Lance d'abord le serveur avec <b>node server.js</b> puis va sur <b>http://localhost:3000</b>";
  }
}

// ================== timer ==================
let timerEls = [];
let lastTick = -1;
function timerBar() {
  const fill = h("div", {});
  const label = h("span", { class: "chip" }, "");
  timerEls.push({ fill, label, total: Math.max(1, (S.duration || 1) * 1000) });
  return { bar: h("div", { class: "timer" }, fill), label };
}
setInterval(() => {
  if (!S || !S.deadline) return;
  const left = Math.max(0, S.deadline - (Date.now() + clockOffset));
  for (const t of timerEls) {
    t.fill.style.width = Math.min(100, (left / t.total) * 100) + "%";
    t.label.textContent = "⏱ " + Math.ceil(left / 1000) + "s";
  }
  const sec = Math.ceil(left / 1000);
  if (S.duration > 3 && sec <= 5 && sec > 0 && sec !== lastTick && ["write", "guess", "vote"].includes(S.phase)) { lastTick = sec; SFX.tick(); }
}, 250);

function header() {
  const t = timerBar();
  return h("div", {},
    h("div", { class: "topbar" },
      h("div", { class: "row", style: "gap:6px" },
        h("span", { class: "chip" }, `Manche ${S.roundNum}/${S.totalRounds} · ${TYPE_LABEL[S.round.type]}`),
        S.round.hot ? h("span", { class: "chip hot-chip" }, "🔥 HOT") : null),
      h("div", { class: "row" },
        S.deadline ? t.label : null,
        isHost() && ["write", "guess", "vote"].includes(S.phase) ? h("button", { class: "btn ghost small", onclick: () => act("skip") }, "Passer ⏭") : null
      )
    ),
    S.deadline ? t.bar : null,
    S.spectator ? h("div", { class: "spec-banner", style: "margin-top:8px" }, "👀 Tu regardes en spectateur") : null
  );
}
const counter = () => h("p", { class: "center muted" }, `${(S.done || []).length}/${S.expected ?? activeCount()} ont répondu`);

// ================== rendu principal ==================
let live = {};
let lastDeadline = null;
function render() {
  if (!S) return;
  const hot = S.phase === "lobby" || S.phase === "end" ? S.settings.packs.length > 0 && S.settings.packs.every((p) => S.packsInfo[p]?.hot) : !!S.round?.hot;
  document.body.classList.toggle("hot", hot);
  const key = [S.phase, S.roundNum, S.item?.index ?? ""].join("|");
  const sameScreen = key === screenKey;
  screenKey = key;
  if (!sameScreen) lastTick = -1;

  // Écrans avec saisie : on ne reconstruit pas le contenu principal pour ne pas perdre le texte en cours
  if (sameScreen && (S.phase === "write" || S.phase === "lobby")) {
    updateLiveBits();
    lastDeadline = S.deadline;
    return;
  }
  lastDeadline = S.deadline;
  timerEls = [];
  const main = h("main", { class: sameScreen ? "panel" : "panel fade-in" });
  const screens = { lobby: lobbyScreen, write: writeScreen, guess: guessScreen, vote: voteScreen, reveal: revealScreen, end: endScreen };
  (screens[S.phase] || (() => {}))(main);
  if (S.phase === "lobby") { $app.className = "app"; $app.replaceChildren(main); }
  else { $app.className = "app with-side"; $app.replaceChildren(main, sidebar()); }
}

function updateLiveBits() {
  if (S.phase === "lobby") { live.players?.(); live.hostBits?.(); return; }
  const side = $app.querySelector("aside");
  if (side) side.replaceWith(sidebar());
  live.writeStatus?.();
  if (S.deadline !== lastDeadline && live.header) { timerEls = []; const nh = header(); live.header.replaceWith(nh); live.header = nh; }
}

// ---------- PHASE D'ÉCRITURE (anecdote / phrase / menteur) ----------
function writeScreen(main) {
  live = {};

  const type = S.round.type;
  const btn = h("button", { class: "btn act" });
  const status = h("div", { class: "center muted", style: "margin-top:10px" });
  live.writeStatus = () => {
    const mine = (S.done || []).includes(S.me);
    btn.textContent = mine ? "✏️ Modifier" : "👍 Valider";
    status.textContent = (mine ? "✅ Envoyé ! " : "") + `${S.done.length}/${activeCount()} joueurs ont répondu`;
  };
  main.append(live.header);

  if (type === "menteur") {
    const inputs = [0, 1, 2].map((i) => h("input", { class: "field act", maxlength: S.maxStatement, placeholder: `Phrase ${i + 1}` }));
    let lie = S.mySub?.lie ?? null;
    if (S.mySub) inputs.forEach((inp, i) => (inp.value = S.mySub.s[i]));
    const radios = [0, 1, 2].map((i) => {
      const r = h("input", { type: "radio", name: "lie", class: "act" });
      r.checked = lie === i;
      r.onchange = () => (lie = i);
      return h("label", { class: "lie-pick" }, r, "Mensonge");
    });
    btn.onclick = () => {
      if (inputs.some((i) => !i.value.trim())) return toast("Écris tes 3 phrases !");
      if (lie == null) return toast("Coche laquelle est le mensonge 🤥");
      SFX.click();
      act("submit", { statements: inputs.map((i) => i.value), lie });
    };
    main.append(
      h("div", { class: "question", style: "margin-top:16px" }, "2 vérités, 1 mensonge"),

      h("div", { style: "max-width:700px;margin:0 auto" }, inputs.map((inp, i) => h("div", { class: "menteur-row" }, radios[i], inp)))
    );
  } else {
    const ta = h("textarea", { class: "field act", maxlength: S.maxText,
      placeholder: type === "phrase" ? "Ta réponse la plus drôle…" : "Raconte ton anecdote… (anonyme jusqu'à la fin !)" });

    const cnt = h("div", { class: "label center", style: "margin:8px 0 14px" });
    const upd = () => (cnt.textContent = `${S.maxText - ta.value.length} caractères restants`);
    ta.addEventListener("input", upd); upd();
    btn.onclick = () => { if (ta.value.trim()) { SFX.click(); act("submit", { text: ta.value }); } else toast("Écris quelque chose !"); };
    main.append(
      h("div", { class: "label center", style: "margin-top:16px" }, type === "phrase" ? "Complète la phrase" : "Thème"),
      h("div", { class: "question" }, S.round.question),
      h("div", { class: "label", style: "margin-bottom:6px" }, type === "phrase" ? "Ta réponse" : "Ton anecdote"),
      ta, cnt
    );
    setTimeout(() => !S.spectator && ta.focus(), 50);
  }
  main.append(h("div", { class: "row center", style: "margin-top:12px" }, btn), status);
  live.writeStatus();
}

// ---------- DEVINER (anecdote / menteur) ----------
function dblToggle() {
  return h("div", { class: "center", style: "margin-top:12px" },
    h("button", { class: "toggle act" + (S.myDbl ? " on" : ""), title: "Bonne réponse = +2, mauvaise = -1",
      onclick: () => { if (S.myVote == null) return toast("Vote d'abord, puis double ta mise 🎲"); act("guess", { itemId: S.item.id, target: S.myVote, dbl: !S.myDbl }); } },
      "🎲 Double ou rien", S.myDbl ? " ✓" : ""),
    h("div", { class: "muted", style: "font-size:12px;margin-top:4px" }, "Bonne réponse = +2 · mauvaise = −1"));
}

function guessScreen(main) {
  live = {};
  const it = S.item;
  main.append(header());
  if (S.round.type === "anecdote") {
    main.append(
      h("div", { class: "label center", style: "margin-top:16px" }, `Anecdote ${it.index}/${it.total} · « ${S.round.question} »`),
      h("div", { class: "question", style: "font-size:clamp(20px,3vw,30px)" }, "À qui appartient cette anecdote ?"),
      h("div", { class: "anec-card" }, it.text),
      S.isMine
        ? h("p", { class: "center", style: "font-size:18px" }, "🤫 C'est la tienne ! Fais genre de rien…")
        : h("p", { class: "center muted" }, S.myVote ? `Tu as voté pour ${player(S.myVote).name} (tu peux changer)` : "Clique sur un joueur"),
      h("div", { class: "players-pick" },
        S.players.map((p) => h("button", { class: "act" + (S.myVote === p.id ? " sel" : ""), disabled: S.isMine,
          onclick: () => { SFX.click(); act("guess", { itemId: it.id, target: p.id, dbl: S.myDbl }); } },
          avatarEl(p), h("span", { class: "pname" }, p.name + (p.id === S.me ? " (toi)" : ""))))),
      S.isMine ? null : dblToggle()
    );
  } else {
    const author = player(it.author);
    main.append(
      h("div", { class: "label center", style: "margin-top:16px" }, `Joueur ${it.index}/${it.total}`),
      h("div", { class: "row center", style: "margin:6px 0 10px" }, avatarEl(author, "lg")),
      h("div", { class: "question", style: "font-size:clamp(20px,3vw,30px)" }, `Quel est le mensonge de ${author.name} ?`),
      h("div", { class: "stmt" }, it.statements.map((s, i) =>
        h("button", { class: "act" + (S.myVote === i ? " sel" : ""), disabled: S.isMine, onclick: () => { SFX.click(); act("guess", { itemId: it.id, target: i, dbl: S.myDbl }); } },
          h("span", { class: "num" }, i + 1), s))),
      S.isMine ? h("p", { class: "center", style: "font-size:18px" }, "😇 Ce sont tes phrases, garde ton sérieux…") : dblToggle()
    );
  }
  main.append(counter());
}

// ---------- VOTES ----------
function voteScreen(main) {
  live = {};
  const r = S.round, type = r.type;
  main.append(header());
  const title = (t) => h("div", { class: "question", style: "margin-top:22px" }, t);
  const vote = (target) => { SFX.click(); act("vote", { target }); };

  if (type === "qui") {
    main.append(title(r.question),
      h("div", { class: "players-pick" }, S.players.map((p) => h("button", { class: "act" + (S.myVote === p.id ? " sel" : ""), onclick: () => vote(p.id) },
        avatarEl(p), h("span", { class: "pname" }, p.name + (p.id === S.me ? " (toi)" : ""))))),
      h("p", { class: "center muted" }, "⚠️ Les votes seront révélés : tout le monde saura qui a voté pour qui !"));
  } else if (type === "ouinon") {
    const max = S.players.length;
    const val = S.myPred ?? null;
    main.append(title(r.question),
      h("div", { class: "yn" },
        h("button", { class: "oui act" + (S.myVote === "oui" ? " sel" : ""), onclick: () => vote("oui") }, "Oui"),
        h("button", { class: "non act" + (S.myVote === "non" ? " sel" : ""), onclick: () => vote("non") }, "Non")),
      h("p", { class: "center muted" }, "🔒 Vote anonyme : seul le total sera affiché."),
      h("div", { class: "center", style: "margin-top:10px" },
        h("div", { class: "label", style: "margin-bottom:6px" }, "🔮 Pronostic : combien de OUI au total ?"),
        h("div", { class: "stepper act" },
          h("button", { onclick: () => act("predict", { n: Math.max(0, (val ?? 1) - 1) }) }, "−"),
          h("span", { class: "val" }, val ?? "?"),
          h("button", { onclick: () => act("predict", { n: Math.min(max, (val ?? -1) + 1) }) }, "+")),
        h("div", { class: "muted", style: "font-size:12px;margin-top:4px" }, "Pile = +2 · à 1 près = +1")));
  } else if (type === "tuprefs" || type === "connais") {
    const target = r.target ? player(r.target) : null;
    const isTarget = r.target === S.me;
    main.append(
      type === "connais" ? h("div", { class: "row center", style: "margin-top:14px" }, avatarEl(target, "lg")) : null,
      title(type === "tuprefs" ? "Tu préfères…" : isTarget ? "Toi, tu préfères…" : `Que préfère ${target.name} ?`),
      type === "connais" ? h("p", { class: "center muted" }, isTarget ? "Réponds honnêtement, les autres essaient de deviner ton choix 🧠" : `Devine ce que ${target.name} va répondre (+1 si juste)`) : null,
      h("div", { class: "opt-grid" },
        h("button", { class: "opt-btn a act" + (S.myVote === 0 ? " sel" : ""), onclick: () => vote(0) }, r.opts[0]),
        h("button", { class: "opt-btn b act" + (S.myVote === 1 ? " sel" : ""), onclick: () => vote(1) }, r.opts[1])),
      type === "tuprefs" ? h("p", { class: "center muted" }, "Les choix seront révélés 👀") : null);
  } else if (type === "jamais") {
    main.append(title(r.question),
      h("div", { class: "opt-grid" },
        h("button", { class: "opt-btn did act" + (S.myVote === "did" ? " sel" : ""), onclick: () => vote("did") }, "🍺 Je l'ai déjà fait"),
        h("button", { class: "opt-btn never act" + (S.myVote === "never" ? " sel" : ""), onclick: () => vote("never") }, "😇 Jamais")),
      h("p", { class: "center muted" }, "⚠️ Pas anonyme : tout le monde verra qui l'a déjà fait !"));
  } else if (type === "phrase") {
    main.append(
      h("div", { class: "label center", style: "margin-top:16px" }, "Vote pour la réponse la plus drôle"),
      title(r.question),
      h("div", { class: "answers" }, S.answers.map((a) =>
        h("button", { class: "act" + (S.myVote === a.id ? " sel" : "") + (a.mine ? " mine" : ""), onclick: () => (a.mine ? toast("C'est ta réponse 😏") : vote(a.id)) },
          a.text, a.mine ? h("div", { class: "muted", style: "font-size:12px" }, "(ta réponse)") : null))));
  }
  main.append(counter());
}

// ---------- RÉVÉLATIONS ----------
function pointsLine() {
  const pts = S.reveal.points || {};
  const ids = Object.keys(pts).filter((id) => pts[id]).sort((a, b) => pts[b] - pts[a]);
  if (!ids.length) return null;
  return h("div", { class: "row center", style: "margin-top:16px;gap:14px" },
    ids.map((id) => h("div", { class: "row", style: "gap:6px" }, avatarEl(player(id), "sm"), h("span", { class: "pixel" }, (pts[id] > 0 ? "+" : "") + pts[id]))));
}

function jokerBox() {
  if (S.spectator) return null;
  const m = me();
  if (!m || m.jokerUsed) return null;
  const pickRow = h("div", { class: "joker-pick", hidden: true },
    S.players.filter((p) => p.id !== S.me).map((p) => h("button", { onclick: () => act("joker", { target: p.id }) }, avatarEl(p, "sm"), p.name)));
  return h("div", { class: "center", style: "margin-top:14px" },
    h("button", { class: "btn ghost small", onclick: () => (pickRow.hidden = !pickRow.hidden) }, "🃏 Utiliser mon joker"),
    h("div", { class: "muted", style: "font-size:12px;margin-top:4px" }, "Une fois par partie : force quelqu'un à raconter l'histoire"),
    pickRow);
}

function nextButton() {
  return h("div", { class: "row center", style: "margin-top:18px" },
    isHost()
      ? h("button", { class: "btn", onclick: () => act("next") }, S.roundNum >= S.totalRounds ? "Voir les résultats 🏆" : "Manche suivante ▶")
      : h("span", { class: "muted" }, `${player(S.hostId).name} passe à la suite…`));
}

function revealScreen(main) {
  live = {};
  const r = S.round, rv = S.reveal, type = r.type;
  main.append(
    h("div", { class: "topbar" }, h("div", { class: "row", style: "gap:6px" },
      h("span", { class: "chip" }, `Manche ${S.roundNum}/${S.totalRounds} · Résultats`),
      r.hot ? h("span", { class: "chip hot-chip" }, "🔥 HOT") : null)),
    S.spectator ? h("div", { class: "spec-banner", style: "margin-top:8px" }, "👀 Tu regardes en spectateur") : null
  );
  const Q = (t) => h("div", { class: "question", style: "margin-top:14px" }, t);

  if (type === "anecdote" || type === "menteur") {
    main.append(Q(type === "anecdote" ? r.question : "2 vérités, 1 mensonge"));
    if (!rv.items.length) main.append(h("p", { class: "center muted" }, "Personne n'a rien écrit… 🦗"));
    main.append(h("div", { style: "display:grid;gap:12px" }, rv.items.map((it) => {
      const author = player(it.author);
      const right = it.votes.filter((v) => v.ok).length;
      const head = type === "anecdote"
        ? [h("div", { class: "txt" }, `« ${it.text} »`), h("div", { class: "row" }, avatarEl(author, "sm"), h("b", {}, `C'était ${author.name} !`), h("span", { class: "muted" }, ` · ${right}/${it.votes.length} ont trouvé`))]
        : [h("div", { class: "row" }, avatarEl(author, "sm"), h("b", {}, author.name), h("span", { class: "muted" }, ` · ${right}/${it.votes.length} ont trouvé le mensonge`)),
           h("div", { class: "stmt" }, it.statements.map((s, i) => h("div", { class: "s " + (i === it.lie ? "lie" : "true") }, h("span", { class: "num" }, i + 1), s, i === it.lie ? " 🤥 MENSONGE" : " ✅")))];
      return h("div", { class: "reveal-card fade-in" }, head,
        h("div", { class: "row", style: "gap:6px" },
          it.votes.length ? it.votes.map((v) => h("div", { class: "vote-line " + (v.ok ? "ok" : "ko") },
            avatarEl(player(v.voter), "sm"), " → ", type === "anecdote" ? avatarEl(player(v.target), "sm") : h("span", { class: "num pixel" }, `n°${v.target + 1}`),
            v.ok ? " ✅" : " ❌", v.dbl ? " 🎲" : "")) : h("span", { class: "muted" }, "Personne n'a voté")));
    })));
    main.append(h("p", { class: "center muted", style: "font-size:13px" }, "+1 par bonne réponse (🎲 : +2 / −1) · +1 pour l'auteur par joueur trompé"));
  } else if (type === "qui") {
    main.append(Q(r.question));
    const t = rv.tally || {};
    const max = Math.max(0, ...Object.values(t).map((v) => v.length));
    const cols = [...S.players].sort((a, b) => (t[b.id]?.length || 0) - (t[a.id]?.length || 0));
    main.append(h("div", { class: "tally" }, cols.map((p) => {
      const voters = t[p.id] || [];
      const top = max > 0 && voters.length === max;
      return h("div", { class: "col fade-in" + (top ? " top" : "") },
        avatarEl(p, "lg", { crown: top }), h("span", { class: "pname" }, p.name),
        h("span", { class: "count" }, voters.length),
        h("div", { class: "mini-row" }, voters.map((id) => avatarEl(player(id), "sm"))));
    })));
  } else if (type === "ouinon") {
    main.append(Q(r.question));
    const { oui, non } = rv.counts;
    const total = Math.max(1, oui + non);
    const bar = (label, n, color) => {
      const fill = h("div", { style: `width:0;background:${color}` });
      requestAnimationFrame(() => requestAnimationFrame(() => (fill.style.width = (n / total) * 100 + "%")));
      return h("div", { class: "bar-row" }, h("span", { class: "n" }, n), h("span", {}, label), h("div", { class: "bar" }, fill));
    };
    main.append(h("div", { class: "bars" }, bar("oui", oui, "var(--green)"), bar("non", non, "var(--red)")),
      h("p", { class: "center muted" }, oui && oui < total ? "👀 Alors… c'est qui ?" : ""));
    const good = rv.preds.filter((p) => p.pts > 0);
    if (rv.preds.length) main.append(h("div", { class: "center", style: "margin-top:10px" },
      h("div", { class: "label", style: "margin-bottom:6px" }, "🔮 Pronostics"),
      good.length ? h("div", { class: "chips-row", style: "justify-content:center" }, good.map((p) => h("span", { class: "ptag" }, avatarEl(player(p.pid), "sm"), `${player(p.pid).name} (${p.n}) ${p.pts === 2 ? "🎯 +2" : "+1"}`)))
        : h("span", { class: "muted" }, "Personne n'a vu juste 🔮💥")));
  } else if (type === "tuprefs" || type === "jamais" || type === "connais") {
    let cols;
    if (type === "tuprefs") {
      main.append(Q("Tu préfères…"));
      cols = [[r.opts[0], rv.choices[0]], [r.opts[1], rv.choices[1]]];
    } else if (type === "jamais") {
      main.append(Q(r.question));
      cols = [["🍺 Déjà fait", rv.did], ["😇 Jamais", rv.never]];
    } else {
      const target = player(r.target);
      main.append(h("div", { class: "row center", style: "margin-top:14px" }, avatarEl(target, "lg")), Q(`Que préfère ${target.name} ?`),
        h("p", { class: "center", style: "font-size:18px" }, rv.answer == null ? `${target.name} n'a pas répondu 🙄` : `${target.name} a choisi : `, rv.answer == null ? null : h("b", {}, r.opts[rv.answer])));
      cols = [0, 1].map((i) => [r.opts[i], rv.guesses.filter((g) => g.choice === i).map((g) => g.pid)]);
    }
    const max = Math.max(...cols.map((c) => c[1].length));
    main.append(h("div", { class: "two-cols" }, cols.map(([label, ids], i) =>
      h("div", { class: "col-box fade-in" + ((type === "connais" ? rv.answer === i : ids.length === max && max > 0) ? " win" : "") },
        h("h3", {}, label, ` (${ids.length})`),
        h("div", { class: "chips-row" }, ids.length ? ids.map(ptag) : h("span", { class: "muted" }, "Personne"))))));
  } else if (type === "phrase") {
    main.append(Q(r.question));
    if (!rv.items.length) main.append(h("p", { class: "center muted" }, "Pas assez de réponses pour voter… 🦗"));
    else main.append(h("div", { style: "display:grid;gap:10px" }, rv.items.map((it, i) =>
      h("div", { class: "reveal-card fade-in", style: i === 0 && it.voters.length ? "outline:3px solid var(--gold)" : "" },
        h("div", { class: "txt", style: "font-size:18px" }, (i === 0 && it.voters.length ? "🏆 " : "") + it.text),
        h("div", { class: "row" }, avatarEl(player(it.author), "sm"), h("b", {}, player(it.author).name), h("span", { class: "muted" }, ` · ${it.voters.length} vote(s)`),
          h("div", { class: "mini-row", style: "max-width:none" }, it.voters.map((id) => avatarEl(player(id), "sm"))))))));
  }
  main.append(pointsLine(), jokerBox(), nextButton());
}

// ---------- FIN ----------
function downloadRecap() {
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const lines = [
    `KIADISSA — récap de la partie (${new Date().toLocaleString("fr-FR")})`, "",
    "🏆 CLASSEMENT", ...ranked.map((p, i) => `${i + 1}. ${p.name} — ${p.score} pts`), "",
    "🏷 TITRES", ...(S.titles || []).map((t) => `${t.emoji} ${t.title} : ${t.ids.map((id) => player(id).name).join(", ")}`), "",
    S.gage ? `🎭 GAGE pour ${player(S.gage.pid).name} : ${S.gage.text}\n` : "",
    "📜 MEILLEURS MOMENTS", ...(S.recap || []),
  ];
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = h("a", { href: URL.createObjectURL(blob), download: `kiadissa-${S.code}.txt` });
  document.body.append(a); a.click(); a.remove();
}

function endScreen(main) {
  live = {};
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const medals = ["🥇", "🥈", "🥉"];
  main.append(
    h("div", { class: "center" }, h("div", { class: "label" }, "Fin de la partie"), h("h1", { class: "title" }, "CLASSEMENT")),
    h("div", { class: "podium" }, ranked.map((p, i) =>
      h("div", { class: "pr fade-in" + (i === 0 ? " first" : "") },
        h("span", { class: "rank" }, medals[i] || i + 1),
        avatarEl(p),
        h("div", {},
          h("div", { class: "pname" }, p.name),
          (S.quiTitles?.[p.id] || []).length ? h("div", { class: "muted", style: "font-size:12px" }, "🏷 " + S.quiTitles[p.id].join(" · ")) : null),
        h("span", { class: "pts" }, p.score + " pts")))),
    S.titles?.length ? h("div", { class: "titles" }, S.titles.map((t) =>
      h("div", { class: "title-row fade-in" }, h("span", { style: "font-size:24px" }, t.emoji), h("span", { class: "t" }, t.title),
        h("div", { class: "chips-row", style: "margin-left:auto" }, t.ids.map(ptag))))) : null,
    S.gage ? h("div", { class: "gage fade-in" },
      h("div", { class: "g-title" }, `🎭 Gage pour ${player(S.gage.pid).name}`),
      h("div", { style: "font-size:18px" }, S.gage.text)) : null,
    jokerBox(),
    h("div", { class: "row center", style: "margin-top:22px" },
      isHost() ? h("button", { class: "btn", onclick: () => act("start") }, "Rejouer 🔁") : null,
      isHost() ? h("button", { class: "btn blue", onclick: () => act("lobby") }, "Retour au salon") : h("span", { class: "muted" }, "L'hôte peut relancer une partie"),
      h("button", { class: "btn ghost", onclick: downloadRecap }, "📜 Télécharger le récap"),
      h("button", { class: "btn ghost", onclick: () => leave() }, "Quitter"))
  );
}

// ================== démarrage ==================
renderChrome();
if (session) {
  const urlCode = location.pathname.slice(1).toUpperCase();
  if (urlCode && urlCode !== session.code) { localStorage.removeItem("qadc_session"); session = null; renderChrome(); renderHome(); }
  else { history.replaceState(null, "", "/" + session.code); connect(); }
} else renderHome();
</script>
</body>
</html>
